name: CI Pipeline

concurrency:
  # Main is grouped per commit: a shared group keeps one pending run and would
  # cancel a queued commit's, locking it out of a release for good. Pull requests
  # group per pull request, where superseding is the point.
  group: pipeline-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

on:
  merge_group:

  # release.yml verifies a commit's own run, and a pull request's checks belong to
  # its head commit, not to what lands on main. Costs a second CI run per merge; a
  # merge queue would collapse it back to one.
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize

jobs:
  check:
    name: "Checks"
    uses: ./.github/workflows/ci-check.yml
    with:
      os: ubuntu-24.04

  build-linux-x86_64:
    needs: check
    name: "Linux x86_64: Build"
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-24.04
