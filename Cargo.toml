[workspace.package]
edition = "2021"
authors = ["Francesco Ceccon", "The Apibara contributors"]
repository = "https://github.com/apibara/dna"
license = "Apache-2.0"

[workspace]
resolver = "2"
members = [
    "observability",
    "etcd",
    "etcd-dbg",
    "protocol",
    "common",
    "benchmark",
    "starknet",
]

[profile.maxperf]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false

[workspace.dependencies]
backon = { version = "1.6.0", features = ["std", "tokio-sleep"] }
bytes = { version = "1.11.1", features = ["serde"] }
byte-unit = "5.2.0"
clap = { version = "4.6.0", features = [
    "derive",
    "env",
    "cargo",
    "unicode",
    "color",
    "unstable-styles",
] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
duration-str = "0.21.0"
error-stack = "0.5.0"
etcd-client = { version = "0.14.1", features = ["tls", "tls-roots"] }
foyer = { version = "0.22.3" }
futures = "0.3.32"
futures-buffered = "0.2.13"
futures-util = "0.3.32"
hex = { version = "0.4.3", features = ["serde"] }
memmap2 = "0.9.10"
mimalloc = "0.1.48"
mixtrics = { version = "0.2.3", features = ["opentelemetry"] }
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = [
    "trace",
    "metrics",
    "rt-tokio",
] }
opentelemetry-otlp = { version = "0.31", features = [
    "trace",
    "metrics",
    "grpc-tonic",
] }
pin-project = "1.1.11"
prost = "0.14.3"
prost-types = "0.14.3"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "default-tls"
] }
rkyv = { version = "0.8.15", features = ["unaligned"] }
roaring = "0.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.18.0"
snafu = "0.9.0"
testcontainers = "0.27.2"
time = { version = "0.3.47", features = ["formatting", "local-offset"] }
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync", "net"] }
tokio-util = "0.7.18"
tonic = { version = "0.14.5", features = ["tls-native-roots"] }
tonic-health = "0.14.5"
tonic-reflection = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tracing = { version = "0.1.44", features = [
    "max_level_trace",
    "release_max_level_debug",
    "valuable",
] }
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3.23", features = [
    "std",
    "env-filter",
    "json",
] }
valuable = "0.1"
url = "2.5"
zstd = "0.13.3"
